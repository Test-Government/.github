# Copy to .github/workflows/ci.yml in a repository. This is the whole file: what CI does is the
# repository's own `devbox run ci` (devbox.json), not this workflow.
#
# No path filter: a required check must report on every pull request, or the pull request can
# never merge.
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    uses: Test-Government/.github/.github/workflows/ci.yml@main
